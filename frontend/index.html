<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spatial Vision - Hand Tracking & Spatial UI</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
</head>
<body>
<main>
<header>
<h1>Spatial Vision</h1>
<p class="hint">Izinkan akses kamera untuk deteksi gestur tangan melalui MediaPipe Hands.</p>
</header>
<section class="stage">
<video id="camera" autoplay muted playsinline></video>
<canvas id="scene"></canvas>
</section>
<div id="stats" class="stats">Status: Menunggu kamera...</div>
</main>
<script type="module">
import init, { detect_pinch } from './pkg/spatial_vision_frontend.js';
init();

const stats = document.getElementById('stats');
let wasPinching = false;      // state pinch antar-frame untuk hysteresis di Rust
let fpsFrames = 0, fpsT0 = performance.now(), fps = 0;

if (typeof Hands === 'undefined') {
  stats.textContent = 'Error: MediaPipe CDN gagal dimuat';
  stats.style.color = '#ff5566';
} else {
  const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0, // lite — cukup akurat untuk pinch, ~3x lebih cepat dari full
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  hands.onResults(r => {
    // Reset saat tidak ada tangan — cegah status lengket di gestur terakhir.
    if (!r.multiHandLandmarks || r.multiHandLandmarks.length === 0) {
      wasPinching = false;
      stats.textContent = `Waiting · FPS ${fps}`;
      stats.style.color = '#8dbbff';
      countFps();
      return;
    }
    const landmarks = r.multiHandLandmarks.map(hand => hand.map(l => [l.x, l.y, l.z]));
    try {
      const s = JSON.parse(detect_pinch(JSON.stringify(landmarks), wasPinching));
      wasPinching = s.isPinching;
      const label = s.gesture === 'pinch' ? `Pinch! ${s.strength}`
        : s.gesture === 'palm' ? 'Palm'
        : 'Waiting';
      stats.textContent = `${label} · FPS ${fps}`;
      stats.style.color = s.isPinching ? '#00ff88' : '#8dbbff';
    } catch (e) {}
    countFps();
  });
  const camera = new Camera(document.getElementById('camera'), {
    onFrame: async () => await hands.send({ image: document.getElementById('camera') }),
    width: 640, height: 360
  });
  camera.start();
}

// FPS rolling 1 detik — feedback loop pengukuran performa.
function countFps() {
  fpsFrames++;
  const now = performance.now();
  if (now - fpsT0 >= 1000) {
    fps = fpsFrames;
    fpsFrames = 0;
    fpsT0 = now;
  }
}
</script>
</body>
</html>
