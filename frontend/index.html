<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spatial Vision - Hand Tracking & Spatial UI</title>
<link rel="stylesheet" href="style.css">
<!-- Self-host MediaPipe Tasks Vision (offline, tanpa CDN). Bundle ESM di-load
     lewat dynamic import di body script agar DOM siap lebih dulu. -->
</head>
<body>
<main>
<header>
<h1>Spatial Vision</h1>
<p class="hint">Arahkan tangan untuk menggerakkan kursor (kerangka hijau = tracking). Pinch = klik, palm = berhenti, swipe kiri/kanan = pindah halaman.</p>
</header>
<section class="stage">
<video id="camera" autoplay muted playsinline></video>
<canvas id="scene"></canvas>
<div id="launcher">
  <div class="page" data-page="0">
    <button class="card" data-name="Media" data-href="https://www.youtube.com" data-desc="Putar video di YouTube">🎬 Media</button>
    <button class="card" data-name="Maps" data-href="https://maps.google.com" data-desc="Cari lokasi di Google Maps">🗺️ Maps</button>
    <button class="card" data-name="Music" data-href="https://open.spotify.com" data-desc="Streaming musik di Spotify">🎵 Music</button>
    <button class="card" data-name="Camera" data-href="https://webcamtoy.com" data-desc="Coba efek kamera web">📷 Camera</button>
  </div>
  <div class="page" data-page="1">
    <button class="card" data-name="Settings" data-href="https://github.com/Niumination/spatial-vision" data-desc="Lihat kode proyek Spatial Vision">⚙️ Settings</button>
    <button class="card" data-name="News" data-href="https://news.google.com" data-desc="Berita terkini di Google News">📰 News</button>
    <button class="card" data-name="Mail" data-href="https://mail.google.com" data-desc="Buka Gmail">✉️ Mail</button>
    <button class="card" data-name="Games" data-href="https://itch.io" data-desc="Jelajahi game indie di itch.io">🎮 Games</button>
  </div>
  <div id="dots"></div>
</div>
<div id="modal" hidden>
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-desc"></p>
    <div class="modal-actions">
      <a id="modal-link" target="_blank" rel="noopener">Buka</a>
      <button id="modal-close">Tutup</button>
    </div>
  </div>
</div>
</section>
<div id="stats" class="stats">Status: Menunggu kamera...</div>
</main>
<script type="module">
import init, { detect_pinch } from './pkg/spatial_vision_frontend.js';
init();

const stats = document.getElementById('stats');
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const stage = document.querySelector('.stage');
const pages = [...document.querySelectorAll('.page')];
const dotsWrap = document.getElementById('dots');

let wasPinching = false;         // state hysteresis (dikirim ke Rust)
let prevPinching = false;        // rising-edge pinch = klik
let cursor = { tx: .5, ty: .5, x: .5, y: .5, visible: false };
let currentPage = 0;
let lastSwipeT = 0;
const swipeHist = [];            // {t, x} — window bergulir utk deteksi swipe
let swipeMuteUntil = 0;          // setelah swipe, hover tangan ditahan sebentar (anti modal tak sengaja)
let handSm = null;               // kerangka tangan ter-smooth (anti jitter visual)
let flashMsg = '', flashUntil = 0;
let fpsFrames = 0, fpsT0 = performance.now(), fps = 0;

// Tulang tangan MediaPipe (21 landmark, 21 koneksi) — untuk menggambar kerangka.
const HAND_BONES = [
  [0,1],[1,2],[2,3],[3,4],          // ibu jari
  [0,5],[5,6],[6,7],[7,8],          // telunjuk
  [5,9],[9,10],[10,11],[11,12],     // tengah
  [9,13],[13,14],[14,15],[15,16],   // manis
  [13,17],[17,18],[18,19],[19,20],  // kelingking
  [0,17]                            // telapak
];

// Dot indikator halaman
pages.forEach((_, i) => {
  const d = document.createElement('span');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => setPage(i));
  dotsWrap.appendChild(d);
});
const dots = [...dotsWrap.children];

const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalDesc = document.getElementById('modal-desc');
const modalLink = document.getElementById('modal-link');
const modalClose = document.getElementById('modal-close');

// Dwell-to-select: tahan kursor di kartu 900ms = klik.
const DWELL_MS = 900;
let dwellTimer = null, dwellCard = null, dwellSource = 'hand';

// Mouse juga bisa klik kartu langsung (dual input, sekalian testable).
document.querySelectorAll('.card').forEach(c =>
  c.addEventListener('click', () => activateCard(c)));
modalClose.addEventListener('click', closeApp);

// Dual input mouse: hover kartu juga memicu dwell-to-select (updateHover yang
// sama dipakai gestur kamera). Listener di document — mouse keluar stage harus
// membatalkan dwell, bukan menggantung.
document.addEventListener('mousemove', e => {
  updateHover(document.elementFromPoint(e.clientX, e.clientY), 'mouse');
});

function setPage(i) {
  currentPage = Math.max(0, Math.min(pages.length - 1, i));
  pages.forEach((p, idx) => p.classList.toggle('active', idx === currentPage));
  dots.forEach((d, idx) => d.classList.toggle('active', idx === currentPage));
}
setPage(0);

function elementAtCursor() {
  // MediaPipe kadang mengeluarkan landmark non-finite (NaN) saat gerak cepat —
  // elementFromPoint(NaN) melempar dan bisa mematikan loop kamera. Guard dulu.
  if (!Number.isFinite(cursor.x) || !Number.isFinite(cursor.y)) return null;
  const r = stage.getBoundingClientRect();
  return document.elementFromPoint(
    r.left + cursor.x * r.width,
    r.top + cursor.y * r.height
  );
}

function openApp(el) {
  modalTitle.textContent = el.dataset.name;
  modalDesc.textContent = el.dataset.desc || '';
  modalLink.href = el.dataset.href || '#';
  modalLink.textContent = 'Buka ' + el.dataset.name;
  modal.hidden = false;
  flashMsg = '✅ ' + el.dataset.name;
  flashUntil = performance.now() + 900;
}

function closeApp() { modal.hidden = true; }

function activateCard(el) {
  clearTimeout(dwellTimer); dwellCard = null;
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 500);
  openApp(el);
}

function updateHover(hov, src = 'hand') {
  // Setelah swipe, hover tangan ditahan dulu — kursor yang mendarat di kartu
  // tidak boleh membuka modal tak sengaja. Mouse tidak terpengaruh.
  if (src === 'hand' && performance.now() < swipeMuteUntil) {
    document.querySelectorAll('.card.hover').forEach(c => c.classList.remove('hover'));
    dwellCard = null; clearTimeout(dwellTimer);
    return;
  }
  document.querySelectorAll('.card.hover').forEach(c => c.classList.remove('hover'));
  const ok = hov && hov.classList.contains('card') && modal.hidden;
  if (!ok) { dwellCard = null; clearTimeout(dwellTimer); return; }
  hov.classList.add('hover');
  if (hov !== dwellCard) {
    dwellCard = hov;
    dwellSource = src;
    clearTimeout(dwellTimer);
    dwellTimer = setTimeout(() => {
      if (dwellCard && modal.hidden) activateCard(dwellCard);
    }, DWELL_MS);
  }
}

// Smoothing kerangka: lerp per-landmark agar tampilan tidak bergetar (jitter
// model lite). Landmark MediaPipe berupa objek {x,y,z} — smoothing per properti.
// Kursor tetap pakai smoothing sendiri di onResults.
function smoothHand(raw) {
  if (!handSm) { handSm = raw; return raw; }
  const k = 0.45;
  const out = raw.map((p, i) => {
    const q = handSm[i];
    return {
      x: q.x + (p.x - q.x) * k,
      y: q.y + (p.y - q.y) * k,
      z: q.z + (p.z - q.z) * k
    };
  });
  handSm = out;
  return out;
}

// Gambar kerangka tangan (21 landmark + tulang) — semua jari terlihat, bukan
// cuma lingkaran kursor. Layar di-mirror (scaleX(-1)) → x dibalik.
function drawHand(lm) {
  const r = canvas.getBoundingClientRect();
  const pt = i => ({ x: (1 - lm[i].x) * r.width, y: lm[i].y * r.height });
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(0,255,136,.4)';
  ctx.beginPath();
  for (const [a, b] of HAND_BONES) {
    const p = pt(a), q = pt(b);
    ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
  }
  ctx.stroke();
  ctx.fillStyle = 'rgba(141,187,255,.85)';
  for (let i = 0; i < 21; i++) {
    const p = pt(i);
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  const tip = pt(8); // ujung telunjuk — titik kendali kursor
  ctx.beginPath(); ctx.arc(tip.x, tip.y, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#00ff88'; ctx.fill();
}

function draw(handLm) {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  if (handLm) drawHand(handLm);
  if (!cursor.visible) return;
  const x = cursor.x * r.width, y = cursor.y * r.height;
  ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,255,136,.18)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#00ff88'; ctx.stroke();
  if (wasPinching) { // ring luar saat pinch — umpan balik "menekan"
    ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,255,136,.6)'; ctx.stroke();
  }
}

function countFps() {
  fpsFrames++;
  const now = performance.now();
  if (now - fpsT0 >= 1000) { fps = fpsFrames; fpsFrames = 0; fpsT0 = now; }
}

let handLandmarker = null;
try {
  const { FilesetResolver, HandLandmarker } = await import('./vendor/mediapipe-tasks/vision_bundle.mjs');
  const vision = await FilesetResolver.forVisionTasks('vendor/mediapipe-tasks/wasm');
  const base = { modelAssetPath: 'vendor/mediapipe-tasks/hand_landmarker.task' };
  const opts = {
    runningMode: 'VIDEO',
    numHands: 1,
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  };
  try {
    // GPU delegate — inference jauh lebih cepat; fallback CPU jika WebGL2 tidak ada.
    handLandmarker = await HandLandmarker.createFromOptions(vision, { baseOptions: { ...base, delegate: 'GPU' }, ...opts });
  } catch (e) {
    console.warn('GPU delegate gagal — fallback CPU:', e);
    handLandmarker = await HandLandmarker.createFromOptions(vision, { baseOptions: base, ...opts });
  }
} catch (e) {
  stats.textContent = 'Error: MediaPipe gagal dimuat (self-host)';
  stats.style.color = '#ff5566';
  console.error('Tasks API init gagal:', e);
}

if (handLandmarker) {
  const video = document.getElementById('camera');
  let lastVideoTime = -1;

  function processResults(results) {
    countFps();
    countFps();
    // Reset saat tidak ada tangan — kursor hilang, status tidak lengket.
    // Dwell mouse (sumber 'mouse') TIDAK dibatalkan — dual input: kamera tanpa
    // tangan tidak boleh mengganggu interaksi mouse.
    if (!results.landmarks || results.landmarks.length === 0) {
      wasPinching = false;
      cursor.visible = false;
      handSm = null;
      if (dwellSource === 'hand') { dwellCard = null; clearTimeout(dwellTimer); }
      stats.textContent = `Waiting · FPS ${fps}`;
      stats.style.color = '#8dbbff';
      draw(null);
      return;
    }

    const hand = results.landmarks[0];
    // Landmark non-finite (MediaPipe output NaN saat gerak cepat/awal init)
    // meracuni smoothing kursor → elementFromPoint melempar → loop kamera mati.
    // Frame tak valid di-skip: state terakhir dipertahankan, tanpa flicker.
    if (!hand || hand.length < 21 ||
        !hand.every(p => Number.isFinite(p.x) && Number.isFinite(p.y))) {
      return;
    }
    const lm = smoothHand(hand); // kerangka ter-smooth (gambar + swipe)

    // Kursor dari ujung telunjuk [8]. Layar di-mirror (scaleX(-1)) → x dibalik.
    cursor.tx = 1 - lm[8].x;
    cursor.ty = lm[8].y;
    cursor.visible = true;
    cursor.x += (cursor.tx - cursor.x) * 0.6; // smoothing kursor (snappy)
    cursor.y += (cursor.ty - cursor.y) * 0.6;

    // Swipe: window 220ms pada ujung telunjuk (display x). Threshold 0.22 +
    // rasio kelurusan > 0.45 = ayunan dominan satu arah, tahan terhadap jitter.
    const now = performance.now();
    swipeHist.push({ t: now, x: 1 - lm[8].x });
    while (swipeHist.length && now - swipeHist[0].t > 220) swipeHist.shift();
    if (swipeHist.length >= 4) {
      const first = swipeHist[0], last = swipeHist[swipeHist.length - 1];
      const dx = last.x - first.x;
      let path = 0;
      for (let i = 1; i < swipeHist.length; i++) path += Math.abs(swipeHist[i].x - swipeHist[i-1].x);
      const straight = path > 0 ? Math.abs(dx) / path : 0;
      if (last.t - first.t > 90 && Math.abs(dx) > 0.22 && straight > 0.45
          && now - lastSwipeT > 500) {
        lastSwipeT = now;
        clearTimeout(dwellTimer); dwellCard = null;
        swipeMuteUntil = now + 450; // kursor tak boleh langsung dwell di kartu
        // Konvensi layar sentuh (TESTING.md): swipe kiri di layar = halaman
        // berikutnya, swipe kanan = kembali. Layar di-mirror → kiri layar = dx<0.
        setPage(currentPage + (dx < 0 ? 1 : -1));
        flashMsg = dx < 0 ? `➡️ Halaman ${currentPage + 1}` : `⬅️ Halaman ${currentPage + 1}`;
        flashUntil = now + 700;
      }
    }

    const landmarks = results.landmarks.map(h => h.map(l => [l.x, l.y, l.z]));
    try {
      const s = JSON.parse(detect_pinch(JSON.stringify(landmarks), wasPinching));
      prevPinching = wasPinching;
      wasPinching = s.isPinching;

      // Rising-edge pinch = klik — jika kursor di atas kartu.
      if (s.isPinching && !prevPinching) {
        const el = elementAtCursor();
        if (el && el.classList.contains('card')) activateCard(el);
      }

      const label = s.gesture === 'pinch' ? `Pinch! ${s.strength}`
        : s.gesture === 'palm' ? 'Palm'
        : 'Waiting';
      stats.textContent = performance.now() < flashUntil ? flashMsg : `${label} · FPS ${fps}`;
      stats.style.color = s.isPinching ? '#00ff88' : '#8dbbff';
      // Palm = tutup modal app (gestur alami "membuka telapak").
      if (s.gesture === 'palm' && !modal.hidden) closeApp();
    } catch (e) {}

    // Hover highlight + dwell-to-select pada kartu di bawah kursor
    updateHover(elementAtCursor());

    draw(lm);
    updateHover(elementAtCursor());
    draw(lm);
  }

  // Video loop: detectForVideo dipanggil sekali per frame video baru (rAF),
  // dengan timestamp monoton naik (wajib untuk runningMode VIDEO).
  function loop(now) {
    if (video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      try { processResults(handLandmarker.detectForVideo(video, now)); }
      catch (e) { console.warn('Frame dilewati:', e.message); }
    }
    requestAnimationFrame(loop);
  }

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 360 }, audio: false
      });
      video.srcObject = stream;
      await video.play();
      stats.textContent = 'Waiting · FPS 0';
      stats.style.color = '#8dbbff';
      requestAnimationFrame(loop);
    } catch (e) {
      // Kamera ditolak/tidak ada: interaksi mouse tetap berfungsi (dual input).
      stats.textContent = 'Kamera tidak tersedia (izin ditolak)';
      stats.style.color = '#ffb020';
    }
  }
  startCamera();
}
</script>
</body>
</html>
