<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spatial Vision - Hand Tracking & Spatial UI</title>
<link rel="stylesheet" href="style.css">
<!-- Self-host MediaPipe (offline, tanpa CDN) -->
<script src="vendor/mediapipe/hands.js"></script>
<script src="vendor/mediapipe/camera_utils.js"></script>
</head>
<body>
<main>
<header>
<h1>Spatial Vision</h1>
<p class="hint">Arahkan tangan untuk menggerakkan kursor. Pinch = klik, palm = berhenti, swipe kiri/kanan = pindah halaman.</p>
</header>
<section class="stage">
<video id="camera" autoplay muted playsinline></video>
<canvas id="scene"></canvas>
<div id="launcher">
  <div class="page" data-page="0">
    <button class="card" data-name="Media" data-href="https://www.youtube.com" data-desc="Putar video di YouTube">🎬 Media</button>
    <button class="card" data-name="Maps" data-href="https://maps.google.com" data-desc="Cari lokasi di Google Maps">🗺️ Maps</button>
    <button class="card" data-name="Music" data-href="https://open.spotify.com" data-desc="Streaming musik di Spotify">🎵 Music</button>
    <button class="card" data-name="Camera" data-href="https://webcamtoy.com" data-desc="Coba efek kamera web">📷 Camera</button>
  </div>
  <div class="page" data-page="1">
    <button class="card" data-name="Settings" data-href="https://github.com/Niumination/spatial-vision" data-desc="Lihat kode proyek Spatial Vision">⚙️ Settings</button>
    <button class="card" data-name="News" data-href="https://news.google.com" data-desc="Berita terkini di Google News">📰 News</button>
    <button class="card" data-name="Mail" data-href="https://mail.google.com" data-desc="Buka Gmail">✉️ Mail</button>
    <button class="card" data-name="Games" data-href="https://itch.io" data-desc="Jelajahi game indie di itch.io">🎮 Games</button>
  </div>
  <div id="dots"></div>
</div>
<div id="modal" hidden>
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-desc"></p>
    <div class="modal-actions">
      <a id="modal-link" target="_blank" rel="noopener">Buka</a>
      <button id="modal-close">Tutup</button>
    </div>
  </div>
</div>
</section>
<div id="stats" class="stats">Status: Menunggu kamera...</div>
</main>
<script type="module">
import init, { detect_pinch } from './pkg/spatial_vision_frontend.js';
init();

const stats = document.getElementById('stats');
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const stage = document.querySelector('.stage');
const pages = [...document.querySelectorAll('.page')];
const dotsWrap = document.getElementById('dots');

let wasPinching = false;         // state hysteresis (dikirim ke Rust)
let prevPinching = false;        // rising-edge pinch = klik
let cursor = { tx: .5, ty: .5, x: .5, y: .5, visible: false };
let currentPage = 0;
let lastSwipeT = 0;
const wristHist = [];            // {t, x} — window 150ms utk deteksi swipe
let flashMsg = '', flashUntil = 0;
let fpsFrames = 0, fpsT0 = performance.now(), fps = 0;

// Dot indikator halaman
pages.forEach((_, i) => {
  const d = document.createElement('span');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => setPage(i));
  dotsWrap.appendChild(d);
});
const dots = [...dotsWrap.children];

const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalDesc = document.getElementById('modal-desc');
const modalLink = document.getElementById('modal-link');
const modalClose = document.getElementById('modal-close');

// Dwell-to-select: tahan kursor di kartu 900ms = klik.
const DWELL_MS = 900;
let dwellTimer = null, dwellCard = null;

// Mouse juga bisa klik kartu langsung (dual input, sekalian testable).
document.querySelectorAll('.card').forEach(c =>
  c.addEventListener('click', () => activateCard(c)));
modalClose.addEventListener('click', closeApp);

function setPage(i) {
  currentPage = Math.max(0, Math.min(pages.length - 1, i));
  pages.forEach((p, idx) => p.classList.toggle('active', idx === currentPage));
  dots.forEach((d, idx) => d.classList.toggle('active', idx === currentPage));
}
setPage(0);

function elementAtCursor() {
  const r = stage.getBoundingClientRect();
  return document.elementFromPoint(
    r.left + cursor.x * r.width,
    r.top + cursor.y * r.height
  );
}

function openApp(el) {
  modalTitle.textContent = el.dataset.name;
  modalDesc.textContent = el.dataset.desc || '';
  modalLink.href = el.dataset.href || '#';
  modalLink.textContent = 'Buka ' + el.dataset.name;
  modal.hidden = false;
  flashMsg = '✅ ' + el.dataset.name;
  flashUntil = performance.now() + 900;
}

function closeApp() { modal.hidden = true; }

function activateCard(el) {
  clearTimeout(dwellTimer); dwellCard = null;
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 500);
  openApp(el);
}

function updateHover(hov) {
  document.querySelectorAll('.card.hover').forEach(c => c.classList.remove('hover'));
  const ok = hov && hov.classList.contains('card') && modal.hidden;
  if (!ok) { dwellCard = null; clearTimeout(dwellTimer); return; }
  hov.classList.add('hover');
  if (hov !== dwellCard) {
    dwellCard = hov;
    clearTimeout(dwellTimer);
    dwellTimer = setTimeout(() => {
      if (dwellCard && modal.hidden) activateCard(dwellCard);
    }, DWELL_MS);
  }
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  if (!cursor.visible) return;
  const x = cursor.x * r.width, y = cursor.y * r.height;
  ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,255,136,.18)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#00ff88'; ctx.stroke();
  if (wasPinching) { // ring luar saat pinch — umpan balik "menekan"
    ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,255,136,.6)'; ctx.stroke();
  }
}

function countFps() {
  fpsFrames++;
  const now = performance.now();
  if (now - fpsT0 >= 1000) { fps = fpsFrames; fpsFrames = 0; fpsT0 = now; }
}

if (typeof Hands === 'undefined') {
  stats.textContent = 'Error: MediaPipe gagal dimuat (self-host)';
  stats.style.color = '#ff5566';
} else {
  const hands = new Hands({ locateFile: f => 'vendor/mediapipe/' + f });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0, // lite — cukup akurat untuk pinch, ~3x lebih cepat dari full
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  hands.onResults(r => {
    countFps();
    // Reset saat tidak ada tangan — kursor hilang, status tidak lengket.
    if (!r.multiHandLandmarks || r.multiHandLandmarks.length === 0) {
      wasPinching = false;
      cursor.visible = false;
      dwellCard = null; clearTimeout(dwellTimer);
      stats.textContent = `Waiting · FPS ${fps}`;
      stats.style.color = '#8dbbff';
      draw();
      return;
    }

    const hand = r.multiHandLandmarks[0];
    // Kursor dari ujung telunjuk [8]. Layar di-mirror (scaleX(-1)) → x dibalik.
    cursor.tx = 1 - hand[8].x;
    cursor.ty = hand[8].y;
    cursor.visible = true;
    cursor.x += (cursor.tx - cursor.x) * 0.5; // smoothing
    cursor.y += (cursor.ty - cursor.y) * 0.5;

    // Swipe: window 150ms pada wrist (display x = 1 - raw x).
    const now = performance.now();
    wristHist.push({ t: now, x: 1 - hand[0].x });
    while (wristHist.length && now - wristHist[0].t > 150) wristHist.shift();
    if (wristHist.length >= 3) {
      const first = wristHist[0], last = wristHist[wristHist.length - 1];
      const dx = last.x - first.x;
      if (last.t - first.t > 60 && Math.abs(dx) > 0.35 && now - lastSwipeT > 600) {
        lastSwipeT = now;
        setPage(currentPage + (dx > 0 ? 1 : -1));
      }
    }

    const landmarks = r.multiHandLandmarks.map(h => h.map(l => [l.x, l.y, l.z]));
    try {
      const s = JSON.parse(detect_pinch(JSON.stringify(landmarks), wasPinching));
      prevPinching = wasPinching;
      wasPinching = s.isPinching;

      // Rising-edge pinch = klik — jika kursor di atas kartu.
      if (s.isPinching && !prevPinching) {
        const el = elementAtCursor();
        if (el && el.classList.contains('card')) activateCard(el);
      }

      const label = s.gesture === 'pinch' ? `Pinch! ${s.strength}`
        : s.gesture === 'palm' ? 'Palm'
        : 'Waiting';
      stats.textContent = performance.now() < flashUntil ? flashMsg : `${label} · FPS ${fps}`;
      stats.style.color = s.isPinching ? '#00ff88' : '#8dbbff';
      // Palm = tutup modal app (gestur alami "membuka telapak").
      if (s.gesture === 'palm' && !modal.hidden) closeApp();
    } catch (e) {}

    // Hover highlight + dwell-to-select pada kartu di bawah kursor
    updateHover(elementAtCursor());

    draw();
  });

  const camera = new Camera(document.getElementById('camera'), {
    onFrame: async () => await hands.send({ image: document.getElementById('camera') }),
    width: 640, height: 360
  });
  camera.start();
}
</script>
</body>
</html>
